# Every morning, remove tour dates that have passed and push, so the site
# never shows old shows. A show stays up on its own day and goes the next morning.
name: Remove past shows

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 7-8am Pacific
  workflow_dispatch:        # "Run workflow" button for testing

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles   # "today" means today in California
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove past shows
        run: python update_tour.py --prune-past
      - name: Commit and push if anything changed
        run: |
          if git diff --quiet index.html; then
            echo "Nothing to remove."
            exit 0
          fi
          git config user.name "littyd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Remove past show(s) (daily bot)"
          git push
